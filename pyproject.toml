[project]
name = "tax-doc-api"
version = "0.1.0"
description = "Tax document classification (tev1) and field extraction API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.143.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "registers>=7.5.0",
    "sqlmodel>=0.0.48",
    "typing-extensions>=4.16.0",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.3.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real Docling + Ollama models (skipped when Ollama or the models are missing)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "n8n"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# B905: zips over ragged sequences are deliberate. RUF001: checkbox glyphs and `›` are meant.
# RUF005: `a + [b]` reads fine. UP046: `Envelope(BaseModel, Generic[T])` keeps the OpenAPI names as they are.
ignore = ["B905", "RUF001", "RUF005", "UP046"]

[tool.ruff.lint.per-file-ignores]
# One field (label, description) or one fixture per line.
"core/forms.py" = ["E501"]
"tests/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path"]
